name: Sabbath push

on:
  schedule:
    - cron: '0 22 * * *'   # every day 07:00 Japan time (Sabbath)
    - cron: '0 11 * * *'   # every day 20:00 Japan time (Study)
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = Sabbath (only if today is Sabbath/eve) · study = study reminder · test = test message'
        type: choice
        options: [auto, study, test]
        default: test

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
      - run: node push.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 11 * * *' && 'study' || 'auto') }}
