ja:(c,et,u,amt)=>`🙏 MYAING Pro をご購入いただきありがとうございます。\n${amt?`${amt} の`:''}ご入金を確認しました ✅\n\n🔑 アクティベーションコード：${c}\n📅 有効期限：${et}\n\n入力方法：\n1. アプリ → Pro（練）→ 👑 Proに登録\n2.「コードを入力」をタップしてコードを入力\n3.「確認」をタップすると Pro が有効になります 🎉\n\n⚠️ このコードはユーザーID ${u} の端末でのみ使えます。\n機種変更やブラウザのデータ削除でIDが変わった場合は、新しいIDをお送りください。`,
en:(c,et,u,amt)=>`🙏 Thank you for purchasing MYAING Pro.\nPayment ${amt?`of ${amt} `:''}received ✅\n\n🔑 Activation code: ${c}\n📅 Valid until: ${et}\n\nHow to activate:\n1. App → Pro (練) → 👑 Get Pro\n2. Tap "Enter activation code" and type the code\n3. Tap "Confirm" — Pro is now active 🎉\n\n⚠️ This code works only on the phone with User ID ${u}.\nIf you change phones or clear browser data, your User ID may change — just send us the new ID.`};
const TMSG={
my:(c,et,u)=>`🎁 MYAING Pro အစမ်းသုံးခွင့် ပေးပါတယ်။\n\n🔑 Activation code: ${c}\n📅 သက်တမ်း: ${et}\n\nထည့်နည်း:\n1. App → Pro (練) → 👑 Pro ဝယ်မယ်\n2. "Activation code ထည့်မယ်" ကိုနှိပ်ပြီး ကုဒ်ကို ထည့်ပါ\n3. "အတည်ပြု" ကိုနှိပ်ရင် Pro ဖွင့်ပြီးပါပြီ 🎉\n\nသက်တမ်းကုန်ရင် Pro အလိုလို ပိတ်သွားပါမယ်။ ဆက်သုံးချင်ရင် ဆက်သွယ်ပါ 🙏\n⚠️ ဒီကုဒ်က User ID ${u} ရှိတဲ့ ဖုန်းမှာသာ အလုပ်လုပ်ပါတယ်။`,
ja:(c,et,u)=>`🎁 MYAING Pro のお試しコードをお送りします。\n\n🔑 アクティベーションコード：${c}\n📅 有効期限：${et}\n\n入力方法：\n1. アプリ → Pro（練）→ 👑 Proに登録\n2.「コードを入力」をタップしてコードを入力\n3.「確認」をタップすると Pro が有効になります 🎉\n\n期限が過ぎると Pro は自動で終了します。続けて使いたい場合はご連絡ください 🙏\n⚠️ このコードはユーザーID ${u} の端末でのみ使えます。`,
en:(c,et,u)=>`🎁 Here is your MYAING Pro free trial.\n\n🔑 Activation code: ${c}\n📅 Valid until: ${et}\n\nHow to activate:\n1. App → Pro (練) → 👑 Get Pro\n2. Tap "Enter activation code" and type the code\n3. Tap "Confirm" — Pro is now active 🎉\n\nPro ends automatically when the trial expires. Contact us if you'd like to continue 🙏\n⚠️ This code works only on the phone with User ID ${u}.`};
const MON={M:1,Q:3,H:6,Y:12},DAYS={W:7,F:15},PLANS=['M','Q','H','Y','W','F'],KEY='myaing.admin.hist';
let L='my';try{L=localStorage.getItem('myaing.admin.lang')||'my'}catch(e){}
const t=k=>S[L][k];
let last=null;
function applyLang(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
const pv=$('plan').value||'M';$('plan').innerHTML=PLANS.map(k=>`<option value="${k}">${t('plans')[k]}</option>`).join('');$('plan').value=pv;
$('mPlan').innerHTML=PLANS.map(k=>`<option value="${k}">${t('plans')[k]}</option>`).join('');
if(last){$('info').textContent=t('info')(last.uid,expText(last.ci))}renderAll()}
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function copyText(s,el){const done=()=>toast(t('copied'));const fb=()=>{try{const ta=el||document.createElement('textarea');if(!el){ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta)}ta.focus();ta.select();ta.setSelectionRange&&ta.setSelectionRange(0,999999);const ok=document.execCommand('copy');if(!el)ta.remove();ok?done():toast(t('hold'))}catch(e){toast(t('hold'))}};try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done,fb)}else fb()}catch(e){fb()}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(h){try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){toast(t('saveFail'))}}
function today(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function codeInfo(code){const t2=/^([WF])(\d{2})(\d{2})(\d{2})-([A-Z0-9]{6})$/.exec((code||'').toUpperCase());if(t2){const exp=new Date(2000+ +t2[2],+t2[3]-1,+t2[4],23,59,59);return{plan:t2[1],yy:t2[2],mm:+t2[3],dd:t2[4],mms:t2[3],exp,live:exp>=new Date()}}const m=/^([MQHY])(\d{2})(\d{2})-([A-Z0-9]{6})$/.exec((code||'').toUpperCase());if(!m)return null;const exp=new Date(2000+ +m[2],+m[3],0,23,59,59);return{plan:m[1],yy:m[2],mm:+m[3],exp,live:exp>=new Date()}}
function expText(ci,lang){return ci.dd?S[lang||L].expD(ci.yy,ci.mms,ci.dd):S[lang||L].exp(ci.yy,ci.mm)}
function planName(r){if(r.p&&(MON[r.p]||DAYS[r.p]))return t('plans')[r.p];const ci=codeInfo(r.code);return ci?t('plans')[ci.plan]:(r.plan||'')}
function recHTML(r){const ci=codeInfo(r.code);const st=ci?(ci.live?`<span class="st ok">${t('live')(expText(ci))}</span>`:`<span class="st ex">${t('dead')(expText(ci))}</span>`):'';
return `<div class="rec"><span>${r.d} · <b>${r.uid}</b> · ${planName(r)} · ${r.method}${r.amt?' · '+r.amt:''}</span><span class="c">${r.code||'—'}</span>${st}${r.note?`<span class="n">📝 ${String(r.note).replace(/[<>&]/g,'')}</span>`:''}<div class="row"><button class="small" style="background:var(--navy)" data-cp="${r.code}">${t('cpCode')}</button><button class="small" style="background:#fff;color:#C8102E;border:1.5px solid #F3B3AD" data-del="${r.id}">${t('del')}</button></div></div>`}
function renderAll(){const h=load();$('all').innerHTML=h.length?h.map(recHTML).join(''):`<span class="n">${t('none')}</span>`;
const ids=new Set(h.map(r=>r.uid)),live=h.filter(r=>{const c=codeInfo(r.code);return c&&c.live}).length;
const ks=h.reduce((a,r)=>{const v=parseInt(String(r.amt||'').replace(/[^0-9]/g,''))||0;return /¥|円|yen/i.test(r.amt||'')?a:a+v},0);const sl=t('sum');
$('sum').innerHTML=`<div><b>${h.length}</b>${sl[0]}</div><div><b>${ids.size}</b>${sl[1]}</div><div><b>${live}</b>${sl[2]}</div><div><b>${ks.toLocaleString('en-US')}</b>${sl[3]}</div>`;renderFind()}
function renderFind(){const q=$('q').value.trim().toUpperCase();if(!q){$('found').innerHTML=`<p class="n">${t('typeId')}</p>`;return}
const h=load().filter(r=>[r.uid,r.code,r.d,r.method,r.amt,r.note||''].join(' ').toUpperCase().includes(q));
$('found').innerHTML=h.length?`<p class="n">${t('found')(h.length)}</p>`+h.map(recHTML).join(''):`<p class="n">${t('notFound')}</p>`}
function buildMsg(){if(!last)return;const ml=$('mlang').value;$('msg').value=(DAYS[last.p]?TMSG:MSG)[ml](last.code,`${expText(last.ci,ml)} (${S[ml].plans[last.p]})`,last.uid,last.amt)}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('myaing.admin.lang',L)}catch(e){}$('mlang').value=L;applyLang();buildMsg()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['gen','find','data'].forEach(k=>$('t-'+k).classList.toggle('hide',k!==b.dataset.t));renderAll()});
$('go').onclick=()=>{const uid=$('uid').value.trim().toUpperCase(),p=$('plan').value;if(!/^[A-Z0-9]{6}$/.test(uid)){alert(t('needId'));return}
const trial=!!DAYS[p];const prev=load().filter(r=>r.uid===uid);const prevT=prev.filter(r=>DAYS[r.p]||/^[WF]\d{6}-/.test(r.code||''));
if(trial){if(prevT.length&&!confirm(t('trialDupe')(uid,prevT.map(r=>r.d).join(', '))))return}else if(prev.length&&!confirm(t('dupe')(uid,prev.length,prev.map(r=>r.d).join(', '))))return;
let code;if(trial){const d=new Date();d.setDate(d.getDate()+DAYS[p]-1);const yy=String(d.getFullYear()).slice(2),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');code=`${p}${yy}${mm}${dd}-${proHash(uid+'|'+p+yy+mm+dd+'|'+PRO_SECRET)}`}
else{const d=new Date();d.setMonth(d.getMonth()+MON[p]);const yy=String(d.getFullYear()).slice(2),mm=String(d.getMonth()+1).padStart(2,'0');code=`${p}${yy}${mm}-${proHash(uid+'|'+p+yy+mm+'|'+PRO_SECRET)}`}
const amt=trial?'':$('amt').value.trim(),method=trial?t('trialM'):$('method').value,note=$('note').value.trim();
last={uid,p,code,amt,ci:codeInfo(code)};$('code').value=code;$('info').textContent=t('info')(uid,expText(last.ci));buildMsg();
$('res').classList.remove('hide');const h=load();if(!h.some(r=>r.code===code)){h.unshift({id:Date.now(),d:today(),uid,p,method,amt,code,note});save(h)}renderAll();$('res').scrollIntoView({behavior:'smooth'})};
$('mlang').onchange=buildMsg;
$('code').onclick=()=>{$('code').select();$('code').setSelectionRange(0,99)};
$('cpCode').onclick=()=>copyText($('code').value,$('code'));$('cpMsg').onclick=()=>copyText($('msg').value,$('msg'));
$('share').onclick=()=>{const s=$('msg').value;if(navigator.share){navigator.share({text:s}).catch(()=>{})}else{location.href='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(s)}};
$('q').oninput=renderFind;
document.addEventListener('click',e=>{const c=e.target.closest('[data-cp]');if(c){copyText(c.dataset.cp);return}const d=e.target.closest('[data-del]');if(d&&confirm(t('delQ'))){save(load().filter(r=>String(r.id)!==d.dataset.del));renderAll()}});
$('verify').onclick=()=>{const uid=$('vuid').value.trim().toUpperCase(),code=$('vcode').value.trim().toUpperCase(),ci=codeInfo(code);
if(!/^[A-Z0-9]{6}$/.test(uid)||!ci){$('vres').innerHTML=t('vBad');return}
const good=proHash(uid+'|'+ci.plan+ci.yy+String(ci.mm).padStart(2,'0')+(ci.dd||'')+'|'+PRO_SECRET)===code.split('-')[1];const rec=load().find(r=>r.code===code);
$('vres').innerHTML=good?t('vOk')(uid,t('plans')[ci.plan],expText(ci),ci.live?`<span class="st ok">${t('liveS')}</span>`:`<span class="st ex">${t('deadS')}</span>`)+'<br>'+(rec?t('vRec')(rec):t('vNoRec')):t('vNo')(uid)};
$('mDate').value=today();
$('mAdd').onclick=()=>{const uid=$('mUid').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(uid)){alert(t('needId'));return}const h=load();h.unshift({id:Date.now(),d:$('mDate').value||today(),uid,p:$('mPlan').value,method:$('mMethod').value,amt:$('mAmt').value.trim(),code:$('mCode').value.trim().toUpperCase(),note:t('manual')});h.sort((a,b)=>String(b.d).localeCompare(String(a.d)));save(h);['mUid','mAmt','mCode'].forEach(i=>$(i).value='');renderAll();toast(t('added'))};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('bkDl').onclick=()=>dl(`myaing-sales-${today()}.json`,JSON.stringify(load(),null,1),'application/json');
$('bkCsv').onclick=()=>dl(`myaing-sales-${today()}.csv`,'﻿Date,UserID,Plan,Method,Amount,Code,Note\n'+load().map(r=>[r.d,r.uid,planName(r),r.method,r.amt,r.code,r.note||''].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
$('bkUp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const inc=JSON.parse(rd.result);if(!Array.isArray(inc))throw 0;const h=load(),have=new Set(h.map(r=>r.code+'|'+r.uid+'|'+r.d));let n=0;inc.forEach(r=>{if(r&&r.uid&&!have.has(r.code+'|'+r.uid+'|'+r.d)){h.push(Object.assign({id:Date.now()+Math.random()},r));n++}});h.sort((a,b)=>String(b.d).localeCompare(String(a.d)));save(h);renderAll();toast(t('restored')(n))}catch(x){alert(t('badBk'))}};rd.readAsText(f)};
$('cpAll').onclick=()=>copyText(load().map(r=>[r.d,r.uid,planName(r),r.method,r.amt,r.code].join(' | ')).join('\n'));
(()=>{const h=load();let ch=false;h.forEach((r,i)=>{if(!r.id){r.id=Date.now()+i;ch=true}});if(ch)save(h)})();
$('mlang').value=L;applyLang();
</script><div id="lock" style="position:fixed;inset:0;background:#F4F6FA;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center"><div style="font-size:40px">🔐</div><b style="font-size:18px">MYAING Admin</b><p class="n" style="margin:0">Admin Key ထည့်ပါ<br>管理者キーを入力<br>Enter admin key</p><input id="lk" type="password" autocomplete="current-password" style="text-align:center;font-size:17px"><label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;font-weight:600"><input id="lkr" type="checkbox" checked style="width:20px;height:20px;min-height:0">ဒီဖုန်းမှာ မှတ်ထားမယ် · この端末で記憶 · Remember</label><button id="lkGo" style="background:var(--navy)">ဝင်မည် · 開く · Unlock</button><p id="lkMsg" class="n" style="margin:0;color:#C8102E"></p></div></div>
<script>
const LK_KEY='myaing.admin.k';
async function lkCheck(k){try{const e=new TextEncoder();const base=await crypto.subtle.importKey('raw',e.encode(k),'PBKDF2',false,['deriveBits']);const salt=new Uint8Array(LK.s.match(/../g).map(x=>parseInt(x,16)));const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:LK.i},base,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===LK.h}catch(err){return false}}
async function lkOpen(k,remember){if(await lkCheck(k)){PRO_SECRET=k;try{if(remember)localStorage.setItem(LK_KEY,k)}catch(e){}document.getElementById('lock').remove();return true}return false}
document.getElementById('lkGo').onclick=async()=>{const m=document.getElementById('lkMsg');m.textContent='…';const ok=await lkOpen(document.getElementById('lk').value.trim(),document.getElementById('lkr').checked);if(!ok)m.textContent='❌ Key မှားနေပါတယ် · キーが違います · Wrong key'};
document.getElementById('lk').onkeydown=e=>{if(e.key==='Enter')document.getElementById('lkGo').click()};
(async()=>{let k='';try{k=localStorage.getItem(LK_KEY)||''}catch(e){}if(!k||!(await lkOpen(k,false))){try{localStorage.removeItem(LK_KEY)}catch(e){}}})();
function lkOut(){try{localStorage.removeItem(LK_KEY)}catch(e){}location.reload()}
</script></body></html>
